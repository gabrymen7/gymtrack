<!DOCTYPE html>
<html lang="it" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GymTrack v2.0 - Diario Palestra</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'] },
                    colors: {
                        dark: { 950: '#09090b', 900: '#121215', 800: '#1c1c21', 700: '#27272e' },
                        brand: { 400: '#34d399', 500: '#10b981', 600: '#059669' }
                    }
                }
            }
        }
    </script>
    <!-- Fallback CSS completo così la pagina resta leggibile e ordinata anche senza rete -->
    <style>
        :root {
            --bg-950: #09090b;
            --bg-900: #121215;
            --bg-800: #1c1c21;
            --border-700: #27272e;
            --emerald: #10b981;
            --amber: #f59e0b;
            --text-main: #f4f4f5;
            --text-muted: #a1a1aa;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            margin: 0;
            background-color: var(--bg-950);
            color: var(--text-main);
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
            padding-bottom: 168px;
        }
        input[type=number]::-webkit-inner-spin-button,
        input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }
        input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(1); opacity: 0.75; cursor: pointer; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .card-box {
            background-color: var(--bg-900);
            border: 1px solid #1f1f26;
            border-radius: 1rem;
        }
        .btn-primary {
            background-color: var(--emerald);
            color: #052e16;
            font-weight: 700;
            border-radius: 0.75rem;
            border: none;
            cursor: pointer;
        }
        .btn-secondary {
            background-color: var(--bg-800);
            color: var(--text-main);
            border: 1px solid var(--border-700);
            border-radius: 0.75rem;
            cursor: pointer;
        }
    </style>
</head>
<body class="bg-dark-950 text-zinc-100 min-h-screen antialiased selection:bg-brand-500 selection:text-dark-950">

    <!-- HEADER FISSO -->
    <header class="sticky top-0 z-30 bg-dark-950/95 backdrop-blur-md border-b border-dark-800 px-4 py-3">
        <div class="max-w-2xl mx-auto flex items-center justify-between gap-2">
            <div class="flex items-center gap-2.5">
                <div class="w-9 h-9 rounded-xl bg-brand-500/15 border border-brand-500/30 flex items-center justify-center text-brand-500 shrink-0">
                    <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M14.4 14.4 9.6 9.6"/><path d="M18.657 21.485a2 2 0 1 1-2.829-2.828l-1.767 1.768a2 2 0 1 1-2.829-2.829l6.364-6.364a2 2 0 1 1 2.829 2.829l-1.768 1.767a2 2 0 1 1 2.828 2.829z"/><path d="m21.5 21.5-1.4-1.4"/><path d="M3.9 3.9 2.5 2.5"/><path d="M6.404 12.768a2 2 0 1 1-2.829-2.829l1.768-1.767a2 2 0 1 1-2.828-2.829l2.828-2.828a2 2 0 1 1 2.829 2.828l1.767-1.768a2 2 0 1 1 2.829 2.829z"/>
                    </svg>
                </div>
                <div>
                    <div class="flex items-center gap-1.5">
                        <h1 class="font-extrabold text-base sm:text-lg tracking-tight text-white leading-none">GymTrack</h1>
                        <span class="text-[10px] font-bold px-1.5 py-0.5 rounded bg-brand-500/15 text-brand-400 border border-brand-500/30">v2.0</span>
                    </div>
                    <p class="text-[11px] text-zinc-400 mt-0.5" id="header-subtitle">Pronto per la sessione</p>
                </div>
            </div>

            <button onclick="exportExcelXLSX()" class="px-3 py-2 rounded-xl bg-emerald-500/15 hover:bg-emerald-500/25 border border-emerald-500/35 text-emerald-400 text-xs font-bold flex items-center gap-1.5 active:scale-95 transition" title="Scarica backup completo in Excel (.xlsx)">
                <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><path d="M8 13h2"/><path d="M8 17h2"/><path d="M14 13h2"/><path d="M14 17h2"/></svg>
                <span>Excel</span>
            </button>
        </div>
    </header>

    <!-- CONTENUTO PRINCIPALE -->
    <main id="app-content" class="max-w-2xl mx-auto px-4 pt-4">
        <!-- Renderizzato dinamicamente -->
    </main>

    <!-- BARRA TIMER DI RECUPERO FISSA IN BASSO (sopra la navbar) -->
    <section id="timer-bar" class="fixed bottom-16 left-0 right-0 z-30 px-3 pb-2 pointer-events-none">
        <div class="max-w-2xl mx-auto bg-dark-900/95 backdrop-blur-md border border-dark-700 rounded-2xl p-3 shadow-2xl pointer-events-auto">
            <div class="flex items-center justify-between gap-2 mb-1.5">
                <div class="flex items-center gap-2 min-w-0">
                    <span id="timer-dot" class="w-2.5 h-2.5 rounded-full bg-zinc-500 shrink-0"></span>
                    <span id="timer-exercise-label" class="text-xs font-bold text-zinc-200 truncate">Recupero Serie</span>
                </div>
                <div class="flex items-center gap-2 shrink-0">
                    <span id="timer-target-text" class="text-[11px] text-zinc-400">Target: 90s</span>
                    <span id="timer-status-badge" class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-dark-800 text-zinc-300 border border-dark-700">Pronto</span>
                </div>
            </div>

            <!-- Barra progresso -->
            <div class="w-full h-1.5 bg-dark-950 rounded-full overflow-hidden mb-2.5">
                <div id="timer-progress" class="h-full bg-zinc-500 transition-all duration-300" style="width: 100%"></div>
            </div>

            <div class="flex items-center justify-between gap-2">
                <div id="timer-display" class="text-2xl sm:text-3xl font-black tabular-nums tracking-tight text-white leading-none">
                    01:30
                </div>

                <div class="flex items-center gap-1.5">
                    <button type="button" onclick="adjustTimer(-15)" class="px-2.5 py-2 rounded-xl bg-dark-800 hover:bg-dark-700 border border-dark-700 text-xs font-bold text-zinc-300 active:scale-95 transition">-15s</button>
                    <button type="button" onclick="adjustTimer(15)" class="px-2.5 py-2 rounded-xl bg-dark-800 hover:bg-dark-700 border border-dark-700 text-xs font-bold text-zinc-300 active:scale-95 transition">+15s</button>
                    <button type="button" onclick="toggleTimerPlayPause()" id="timer-play-btn" class="px-3.5 py-2 rounded-xl bg-brand-500 hover:bg-brand-600 text-dark-950 text-xs font-extrabold flex items-center gap-1 active:scale-95 transition">
                        <span id="timer-play-icon">▶</span>
                        <span id="timer-play-text">Avvia</span>
                    </button>
                    <button type="button" onclick="resetTimerStopped()" class="px-3 py-2 rounded-xl bg-dark-800 hover:bg-dark-700 border border-dark-700 text-xs font-bold text-zinc-200 active:scale-95 transition" title="Ferma e riporta al tempo iniziale">
                        ↺ Reset
                    </button>
                </div>
            </div>
        </div>
    </section>

    <!-- NAVIGAZIONE INFERIORE FISSA A 4 SCHEDE -->
    <nav class="fixed bottom-0 left-0 right-0 z-40 bg-dark-950/95 backdrop-blur-md border-t border-dark-800 h-16">
        <div class="max-w-2xl mx-auto grid grid-cols-4 h-full">
            <button type="button" onclick="switchTab('workout')" id="nav-workout" class="flex flex-col items-center justify-center gap-1 text-brand-500 font-bold transition">
                <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="10"/><polygon points="10 8 16 12 10 16 10 8"/></svg>
                <span class="text-[11px]">Allena</span>
            </button>
            <button type="button" onclick="switchTab('routines')" id="nav-routines" class="flex flex-col items-center justify-center gap-1 text-zinc-400 hover:text-zinc-200 font-medium transition">
                <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M12 11h4"/><path d="M12 16h4"/><path d="M8 11h.01"/><path d="M8 16h.01"/></svg>
                <span class="text-[11px]">Schede</span>
            </button>
            <button type="button" onclick="switchTab('history')" id="nav-history" class="flex flex-col items-center justify-center gap-1 text-zinc-400 hover:text-zinc-200 font-medium transition">
                <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></svg>
                <span class="text-[11px]">Storico</span>
            </button>
            <button type="button" onclick="switchTab('progress')" id="nav-progress" class="flex flex-col items-center justify-center gap-1 text-zinc-400 hover:text-zinc-200 font-medium transition">
                <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></svg>
                <span class="text-[11px]">Progressi</span>
            </button>
        </div>
    </nav>

    <!-- MODALE GENERICO -->
    <div id="custom-modal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm hidden items-end sm:items-center justify-center p-0 sm:p-4">
        <div class="bg-dark-900 border-t sm:border border-dark-700 w-full max-w-md rounded-t-3xl sm:rounded-3xl p-5 shadow-2xl" id="modal-box"></div>
    </div>

    <!-- TOAST NOTIFICA -->
    <div id="toast" class="fixed top-16 left-1/2 -translate-x-1/2 z-50 bg-dark-800 border border-brand-500/50 text-white px-4 py-2.5 rounded-full shadow-2xl flex items-center gap-2 text-xs sm:text-sm font-semibold opacity-0 pointer-events-none transition-all duration-300 -translate-y-2">
        <span id="toast-icon" class="text-brand-400">✓</span>
        <span id="toast-message">Operazione completata</span>
    </div>

    <script>
        // ============================================================
        // 1. ARCHIVIO DATI & MIGRAZIONE STORAGE (gymtrack_v2_data)
        // ============================================================
        const STORAGE_KEY = 'gymtrack_v2_data';
        const OLD_KEYS = ['gymtrack_v4', 'gymtrack_v3', 'gymtrack_data_v3', 'gymtrack_data'];

        const DEFAULT_ROUTINES = [
            {
                id: 'routine-a',
                name: 'Giorno A',
                visibleInHome: true,
                exercises: [
                    { id: 'ex-a1', name: 'Panca Piana Bilanciere', sets: 4, targetReps: '6-8', rest: 120, lastWeights: [], lastReps: [] },
                    { id: 'ex-a2', name: 'Lat Machine Avanti', sets: 4, targetReps: '8-10', rest: 90, lastWeights: [], lastReps: [] },
                    { id: 'ex-a3', name: 'Military Press Manubri', sets: 3, targetReps: '8-10', rest: 90, lastWeights: [], lastReps: [] },
                    { id: 'ex-a4', name: 'Leg Press 45°', sets: 4, targetReps: '10', rest: 120, lastWeights: [], lastReps: [] },
                    { id: 'ex-a5', name: 'Curl Bilanciere EZ', sets: 3, targetReps: '10-12', rest: 75, lastWeights: [], lastReps: [] },
                    { id: 'ex-a6', name: 'French Press Manubri', sets: 3, targetReps: '10-12', rest: 75, lastWeights: [], lastReps: [] }
                ]
            },
            {
                id: 'routine-b',
                name: 'Giorno B',
                visibleInHome: true,
                exercises: [
                    { id: 'ex-b1', name: 'Inclinata Manubri', sets: 4, targetReps: '8-10', rest: 120, lastWeights: [], lastReps: [] },
                    { id: 'ex-b2', name: 'Rematore Manubrio', sets: 4, targetReps: '8-10', rest: 90, lastWeights: [], lastReps: [] },
                    { id: 'ex-b3', name: 'Alzate Laterali', sets: 4, targetReps: '12-15', rest: 60, lastWeights: [], lastReps: [] },
                    { id: 'ex-b4', name: 'Romanian Deadlift', sets: 3, targetReps: '8-10', rest: 120, lastWeights: [], lastReps: [] },
                    { id: 'ex-b5', name: 'Hammer Curl', sets: 3, targetReps: '10-12', rest: 75, lastWeights: [], lastReps: [] },
                    { id: 'ex-b6', name: 'Pushdown Cavi', sets: 3, targetReps: '10-12', rest: 75, lastWeights: [], lastReps: [] }
                ]
            },
            {
                id: 'routine-c',
                name: 'Giorno C',
                visibleInHome: true,
                exercises: [
                    { id: 'ex-c1', name: 'Chest Press', sets: 4, targetReps: '8-10', rest: 90, lastWeights: [], lastReps: [] },
                    { id: 'ex-c2', name: 'Pulley Basso', sets: 4, targetReps: '10', rest: 90, lastWeights: [], lastReps: [] },
                    { id: 'ex-c3', name: 'Shoulder Press', sets: 3, targetReps: '8-10', rest: 90, lastWeights: [], lastReps: [] },
                    { id: 'ex-c4', name: 'Leg Extension', sets: 3, targetReps: '12-15', rest: 75, lastWeights: [], lastReps: [] },
                    { id: 'ex-c5', name: 'Curl Concentrato', sets: 3, targetReps: '10-12', rest: 60, lastWeights: [], lastReps: [] },
                    { id: 'ex-c6', name: 'Dip / Estensioni', sets: 3, targetReps: '10-12', rest: 75, lastWeights: [], lastReps: [] }
                ]
            }
        ];

        function normalizeData(raw) {
            if (!raw || !Array.isArray(raw.routines)) {
                return {
                    version: 2,
                    activeRoutineId: 'routine-a',
                    routines: JSON.parse(JSON.stringify(DEFAULT_ROUTINES)),
                    history: []
                };
            }
            return {
                version: 2,
                activeRoutineId: raw.activeRoutineId || (raw.routines[0] ? raw.routines[0].id : 'routine-a'),
                routines: raw.routines.map(r => ({
                    id: r.id || ('routine-' + Math.random().toString(36).slice(2, 8)),
                    name: r.name || 'Scheda',
                    visibleInHome: r.visibleInHome !== undefined ? Boolean(r.visibleInHome) : true,
                    exercises: Array.isArray(r.exercises) ? r.exercises.map(ex => ({
                        id: ex.id || ('ex-' + Math.random().toString(36).slice(2, 8)),
                        name: ex.name || 'Esercizio',
                        sets: Math.max(1, parseInt(ex.sets) || 3),
                        targetReps: String(ex.targetReps || '10'),
                        rest: !isNaN(parseInt(ex.rest)) && parseInt(ex.rest) > 0 ? parseInt(ex.rest) : 90,
                        lastWeights: Array.isArray(ex.lastWeights) ? ex.lastWeights : [],
                        lastReps: Array.isArray(ex.lastReps) ? ex.lastReps : []
                    })) : []
                })),
                history: Array.isArray(raw.history) ? raw.history : []
            };
        }

        function loadAppState() {
            try {
                const current = localStorage.getItem(STORAGE_KEY);
                if (current) {
                    return normalizeData(JSON.parse(current));
                }
                for (const key of OLD_KEYS) {
                    const legacy = localStorage.getItem(key);
                    if (legacy) {
                        const migrated = normalizeData(JSON.parse(legacy));
                        localStorage.setItem(STORAGE_KEY, JSON.stringify(migrated));
                        return migrated;
                    }
                }
            } catch (err) {
                console.error('Errore lettura localStorage:', err);
            }
            const initial = normalizeData(null);
            localStorage.setItem(STORAGE_KEY, JSON.stringify(initial));
            return initial;
        }

        function persistAppState() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
            } catch (err) {
                showToast('Impossibile salvare nello storage locale', true);
            }
        }

        let appState = loadAppState();
        let currentTab = 'workout';
        let sessionDrafts = {};
        let workoutDate = getTodayISO();

        // Stato Progressi
        let selectedProgressExercise = '';
        let progressMetric = 'maxWeight';
        let chartPointsCache = [];
        let activeChartPointIndex = null;

        // Stato Timer
        let timerInterval = null;
        let timerTargetSeconds = 90;
        let timerSecondsLeft = 90;
        let timerRunning = false;
        let timerExerciseTitle = 'Recupero Serie';

        function getTodayISO() {
            const d = new Date();
            const tzOffset = d.getTimezoneOffset() * 60000;
            return new Date(d.getTime() - tzOffset).toISOString().slice(0, 10);
        }

        function getNextWorkoutNumber() {
            if (!appState.history || appState.history.length === 0) return 1;
            const maxN = appState.history.reduce((acc, item, i) => {
                const num = parseInt(item.workoutNumber) || (appState.history.length - i);
                return num > acc ? num : acc;
            }, 0);
            return maxN + 1;
        }

        // ============================================================
        // 2. LOGICA BOZZA ALLENAMENTO, PRE-RIEMPIMENTO E PROPAGAZIONE LIVE
        // ============================================================
        function getLastLoggedSets(exerciseObj) {
            if (appState.history && appState.history.length > 0) {
                const sorted = [...appState.history].sort((a, b) => {
                    const d = new Date(b.date) - new Date(a.date);
                    return d !== 0 ? d : (b.workoutNumber || 0) - (a.workoutNumber || 0);
                });
                for (const session of sorted) {
                    const match = session.exercises.find(e => e.name.toLowerCase() === exerciseObj.name.toLowerCase());
                    if (match && Array.isArray(match.sets) && match.sets.length > 0) {
                        return match.sets.map(s => ({ kg: s.weight, reps: s.reps }));
                    }
                }
            }
            const res = [];
            for (let i = 0; i < exerciseObj.sets; i++) {
                res.push({
                    kg: exerciseObj.lastWeights?.[i] ?? '',
                    reps: exerciseObj.lastReps?.[i] ?? ''
                });
            }
            return res;
        }

        function buildDraftForRoutine(routineId) {
            const routine = appState.routines.find(r => r.id === routineId);
            if (!routine) return;

            sessionDrafts[routineId] = routine.exercises.map(ex => {
                const lastSets = getLastLoggedSets(ex);
                const rows = [];
                for (let i = 0; i < ex.sets; i++) {
                    const ref = lastSets[i] || lastSets[lastSets.length - 1] || { kg: '', reps: '' };
                    rows.push({
                        kg: ref.kg !== '' && ref.kg !== undefined ? String(ref.kg) : '',
                        reps: ref.reps !== '' && ref.reps !== undefined ? String(ref.reps) : '',
                        completed: false
                    });
                }
                return { exerciseId: ex.id, name: ex.name, sets: rows };
            });
        }

        // Propagazione istantanea dalla Serie 1 alle serie successive NON completate
        function onSetFieldInput(routineId, exIdx, setIdx, field, val) {
            if (!sessionDrafts[routineId]) buildDraftForRoutine(routineId);
            const exDraft = sessionDrafts[routineId]?.[exIdx];
            if (!exDraft || !exDraft.sets[setIdx]) return;

            exDraft.sets[setIdx][field] = val;

            if (setIdx === 0) {
                for (let i = 1; i < exDraft.sets.length; i++) {
                    if (!exDraft.sets[i].completed) {
                        exDraft.sets[i][field] = val;
                        const inputEl = document.querySelector(
                            `input[data-ex="${exIdx}"][data-set="${i}"][data-field="${field}"]`
                        );
                        if (inputEl) {
                            inputEl.value = val;
                        }
                    }
                }
            }
        }

        function toggleSetDone(routineId, exIdx, setIdx) {
            if (!sessionDrafts[routineId]) buildDraftForRoutine(routineId);
            const routine = appState.routines.find(r => r.id === routineId);
            const exMeta = routine?.exercises[exIdx];
            const row = sessionDrafts[routineId]?.[exIdx]?.sets[setIdx];
            if (!exMeta || !row) return;

            row.completed = !row.completed;
            if (row.completed) {
                const restSec = parseInt(exMeta.rest) || 90;
                startRestTimer(restSec, exMeta.name);
            }
            renderCurrentView();
        }

        // ============================================================
        // 3. TIMER DI RECUPERO (AVVIA / PAUSA / RESET CHE FERMA)
        // ============================================================
        function formatMMSS(totalSec) {
            const safe = Math.max(0, Math.floor(totalSec));
            const m = String(Math.floor(safe / 60)).padStart(2, '0');
            const s = String(safe % 60).padStart(2, '0');
            return `${m}:${s}`;
        }

        function startRestTimer(seconds, label) {
            clearInterval(timerInterval);
            timerInterval = null;

            const validSec = parseInt(seconds) > 0 ? parseInt(seconds) : timerTargetSeconds;
            timerTargetSeconds = validSec;
            timerSecondsLeft = validSec;
            if (label) timerExerciseTitle = label;
            timerRunning = true;

            updateTimerBarUI();
            timerInterval = setInterval(tickTimer, 1000);
        }

        function tickTimer() {
            timerSecondsLeft--;
            if (timerSecondsLeft <= 0) {
                timerSecondsLeft = 0;
                clearInterval(timerInterval);
                timerInterval = null;
                timerRunning = false;
                updateTimerBarUI(true);
                triggerBeep();
                showToast(`Recupero completato: ${timerExerciseTitle}`);
                return;
            }
            updateTimerBarUI();
        }

        function toggleTimerPlayPause() {
            if (timerRunning) {
                clearInterval(timerInterval);
                timerInterval = null;
                timerRunning = false;
                updateTimerBarUI();
            } else {
                if (timerSecondsLeft <= 0) {
                    timerSecondsLeft = timerTargetSeconds;
                }
                timerRunning = true;
                updateTimerBarUI();
                clearInterval(timerInterval);
                timerInterval = setInterval(tickTimer, 1000);
            }
        }

        // RESET: ferma immediatamente e riporta al valore iniziale restando in stato "Pronto"
        function resetTimerStopped() {
            clearInterval(timerInterval);
            timerInterval = null;
            timerRunning = false;
            timerSecondsLeft = timerTargetSeconds;
            updateTimerBarUI(false);
        }

        function adjustTimer(delta) {
            timerSecondsLeft = Math.max(5, timerSecondsLeft + delta);
            if (timerSecondsLeft > timerTargetSeconds) {
                timerTargetSeconds = timerSecondsLeft;
            }
            updateTimerBarUI();
        }

        function updateTimerBarUI(justCompleted = false) {
            const displayEl = document.getElementById('timer-display');
            const labelEl = document.getElementById('timer-exercise-label');
            const targetEl = document.getElementById('timer-target-text');
            const statusEl = document.getElementById('timer-status-badge');
            const dotEl = document.getElementById('timer-dot');
            const progEl = document.getElementById('timer-progress');
            const playBtn = document.getElementById('timer-play-btn');
            const playIcon = document.getElementById('timer-play-icon');
            const playText = document.getElementById('timer-play-text');

            if (!displayEl) return;

            displayEl.textContent = formatMMSS(timerSecondsLeft);
            labelEl.textContent = timerExerciseTitle;
            targetEl.textContent = `Target: ${timerTargetSeconds}s`;

            const pct = timerTargetSeconds > 0 ? Math.max(0, Math.min(100, (timerSecondsLeft / timerTargetSeconds) * 100)) : 0;

            if (timerRunning) {
                dotEl.className = 'w-2.5 h-2.5 rounded-full bg-brand-500 animate-pulse shrink-0';

                statusEl.className = 'text-[10px] font-bold px-2 py-0.5 rounded-full bg-brand-500/15 text-brand-400 border border-brand-500/30';

        function triggerBeep() {
            try {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                const ctx = new AudioCtx();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(880, ctx.currentTime);
                gain.gain.setValueAtTime(0.25, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.5);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.5);
            } catch (e) {}
        }

        function switchTab(tabName) {
            currentTab = tabName;
            ['workout', 'routines', 'history', 'progress'].forEach(t => {
                const el = document.getElementById(`nav-${t}`);
                if (!el) return;
                if (t === tabName) {
                    el.classList.remove('text-zinc-400', 'font-medium');
                    el.classList.add('text-brand-500', 'font-bold');
                } else {
                    el.classList.add('text-zinc-400', 'font-medium');
                    el.classList.remove('text-brand-500', 'font-bold');
                }
            });
            renderCurrentView();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function renderCurrentView() {
            const main = document.getElementById('app-content');
            const sub = document.getElementById('header-subtitle');

            if (currentTab === 'workout') {
                sub.textContent = 'Inserisci i carichi e spunta le serie';
                main.innerHTML = renderWorkoutTab();
            } else if (currentTab === 'routines') {
                sub.textContent = 'Schede, recuperi e visibilità Home';
                main.innerHTML = renderRoutinesTab();
            } else if (currentTab === 'history') {
                sub.textContent = 'Storico sessioni e backup Excel';
                main.innerHTML = renderHistoryTab();
            } else if (currentTab === 'progress') {
                sub.textContent = 'Grafico progressione carichi';
                main.innerHTML = renderProgressTab();
                drawNativeProgressChart();
            }
        }

        function selectWorkoutRoutine(routineId) {
            appState.activeRoutineId = routineId;
            persistAppState();
            if (!sessionDrafts[routineId]) buildDraftForRoutine(routineId);
            renderCurrentView();
        }

        function saveWorkoutSession(routineId) {
            const routine = appState.routines.find(r => r.id === routineId);
            if (!routine) return;

            const drafts = sessionDrafts[routineId] || [];
            const loggedExercises = [];
            const num = getNextWorkoutNumber();
            const dateStr = workoutDate || getTodayISO();

            routine.exercises.forEach((ex, idx) => {
                const exDraft = drafts[idx];
                if (!exDraft) return;
                const fallbackRep = parseInt((ex.targetReps.match(/\d+/g) || ['10']).pop()) || 10;
                const doneSets = exDraft.sets.filter(s => s.completed);

                if (doneSets.length > 0) {
                    const formattedSets = doneSets.map(s => ({
                        weight: s.kg !== '' && !isNaN(parseFloat(s.kg)) ? parseFloat(s.kg) : 0,
                        reps: s.reps !== '' && !isNaN(parseInt(s.reps)) ? parseInt(s.reps) : fallbackRep
                    }));
                    ex.lastWeights = formattedSets.map(s => s.weight);
                    ex.lastReps = formattedSets.map(s => s.reps);
                    loggedExercises.push({ exerciseId: ex.id, name: ex.name, sets: formattedSets });
                }
            });

            if (loggedExercises.length === 0) {
                showToast('Spunta in verde (✓) almeno una serie prima di salvare!', true);
                return;
            }

            appState.history.unshift({
                id: 'log-' + Date.now(),
                workoutNumber: num,
                date: dateStr,
                routineId: routine.id,
                routineName: routine.name,
                exercises: loggedExercises
            });

            appState.history.sort((a, b) => {
                const diff = new Date(b.date) - new Date(a.date);
                return diff !== 0 ? diff : (b.workoutNumber || 0) - (a.workoutNumber || 0);
            });

            persistAppState();
            buildDraftForRoutine(routineId);
            showToast(`Allenamento #${num} salvato nello storico!`);
            renderCurrentView();
        }

        function getUniqueExerciseList() {

            appState.routines.forEach(r => r.exercises.forEach(e => set.add(e.name)));

        function getSeriesForExercise(exName) {
            if (!exName) return [];
            const chrono = [...appState.history].sort((a, b) => {
                const d = new Date(a.date) - new Date(b.date);
                return d !== 0 ? d : (a.workoutNumber || 0) - (b.workoutNumber || 0);
            });

            const out = [];
            chrono.forEach((log, idx) => {
                const found = log.exercises.find(e => e.name.toLowerCase() === exName.toLowerCase());
                if (found && found.sets && found.sets.length > 0) {
                    let maxW = 0;
                    let vol = 0;
                    let best1RM = 0;
                    found.sets.forEach(s => {
                        const w = parseFloat(s.weight) || 0;
                        const r = parseInt(s.reps) || 0;
                        if (w > maxW) maxW = w;
                        vol += w * r;
                        const est = r === 1 ? w : w * (1 + r / 30);
                        if (est > best1RM) best1RM = est;
                    });
                    out.push({
                        num: log.workoutNumber || (idx + 1),
                        date: log.date.slice(0, 10),
                        shortLabel: `#${log.workoutNumber || (idx + 1)}`,
                        maxWeight: Number(maxW.toFixed(1)),
                        volume: Math.round(vol),
                        e1rm: Number(best1RM.toFixed(1)),
                        sets: found.sets
                    });
                }
            });
            return out;
        }

        function drawNativeProgressChart() {
            const canvas = document.getElementById('native-progress-canvas');
            if (!canvas || chartPointsCache.length === 0) return;

            const dpr = window.devicePixelRatio || 1;
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width * dpr;
            canvas.height = rect.height * dpr;

            const ctx = canvas.getContext('2d');
            ctx.scale(dpr, dpr);

            const W = rect.width;
            const H = rect.height;
            const padLeft = 44;
            const padRight = 18;
            const padTop = 20;
            const padBottom = 28;
            const plotW = W - padLeft - padRight;
            const plotH = H - padTop - padBottom;

            const values = chartPointsCache.map(p => p[progressMetric]);
            let minV = Math.min(...values);
            let maxV = Math.max(...values);
            if (minV === maxV) {
                minV = Math.max(0, minV - 5);
                maxV = maxV + 5;
            } else {
                const margin = (maxV - minV) * 0.15;
                minV = Math.max(0, minV - margin);
                maxV = maxV + margin;
            }

            ctx.clearRect(0, 0, W, H);

            // Griglia orizzontale e etichette Y
            ctx.font = '11px Inter, sans-serif';
            ctx.textAlign = 'right';
            ctx.textBaseline = 'middle';
            const steps = 4;
            for (let i = 0; i <= steps; i++) {
                const ratio = i / steps;
                const y = padTop + plotH - ratio * plotH;
                const val = minV + ratio * (maxV - minV);

                ctx.strokeStyle = 'rgba(63, 63, 70, 0.45)';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(padLeft, y);
                ctx.lineTo(W - padRight, y);
                ctx.stroke();

                ctx.fillStyle = '#a1a1aa';
                ctx.fillText(Math.round(val) + 'kg', padLeft - 6, y);
            }

            // Calcolo coordinate punti
            const coords = chartPointsCache.map((p, idx) => {
                const x = chartPointsCache.length === 1
                    ? padLeft + plotW / 2
                    : padLeft + (idx / (chartPointsCache.length - 1)) * plotW;
                const y = padTop + plotH - ((p[progressMetric] - minV) / (maxV - minV)) * plotH;
                return { x, y, point: p, idx };
            });

            // Area sfumata sotto la linea
            if (coords.length > 1) {
                const grad = ctx.createLinearGradient(0, padTop, 0, padTop + plotH);
                grad.addColorStop(0, 'rgba(16, 185, 129, 0.35)');
                grad.addColorStop(1, 'rgba(16, 185, 129, 0.0)');
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.moveTo(coords[0].x, padTop + plotH);
                coords.forEach(c => ctx.lineTo(c.x, c.y));
                ctx.lineTo(coords[coords.length - 1].x, padTop + plotH);
                ctx.closePath();
                ctx.fill();

                // Linea principale
                ctx.strokeStyle = '#10b981';
                ctx.lineWidth = 3;
                ctx.lineJoin = 'round';
                ctx.beginPath();
                coords.forEach((c, i) => {
                    if (i === 0) ctx.moveTo(c.x, c.y);
                    else ctx.lineTo(c.x, c.y);
                });
                ctx.stroke();
            }

            // Punti ed etichette asse X
            ctx.textAlign = 'center';
            ctx.textBaseline = 'top';
            const selectedIdx = activeChartPointIndex !== null ? activeChartPointIndex : coords.length - 1;

            coords.forEach(c => {
                const isSel = c.idx === selectedIdx;
                ctx.fillStyle = isSel ? '#34d399' : '#10b981';
                ctx.beginPath();
                ctx.arc(c.x, c.y, isSel ? 6.5 : 4.5, 0, Math.PI * 2);
                ctx.fill();

                ctx.strokeStyle = '#09090b';
                ctx.lineWidth = 2;
                ctx.stroke();

                ctx.fillStyle = isSel ? '#ffffff' : '#a1a1aa';
                ctx.fillText(c.point.shortLabel, c.x, padTop + plotH + 8);
            });

            // Interazione click/touch per selezionare un punto
            canvas.onclick = function(ev) {
                const b = canvas.getBoundingClientRect();
                const clickX = ev.clientX - b.left;
                let closest = 0;
                let minDist = Infinity;
                coords.forEach(c => {
                    const dist = Math.abs(c.x - clickX);
                    if (dist < minDist) {
                        minDist = dist;
                        closest = c.idx;
                    }
                });
                activeChartPointIndex = closest;
                renderCurrentView();
            };
        }

        // ============================================================
        // 6. GENERATORE & PARSER NATIVO EXCEL (.XLSX) IN PURO JAVASCRIPT
        //    (OpenXML ZIP STORE senza dipendenze esterne CDN)
        // ============================================================
        const CRC_TABLE = (() => {
            const table = new Uint32Array(256);
            for (let i = 0; i < 256; i++) {
                let c = i;
                for (let k = 0; k < 8; k++) {
                    c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
                }
                table[i] = c;
            }
            return table;
        })();

        function crc32(bytes) {
            let crc = 0xFFFFFFFF;
            for (let i = 0; i < bytes.length; i++) {
                crc = CRC_TABLE[(crc ^ bytes[i]) & 0xFF] ^ (crc >>> 8);
            }
            return (crc ^ 0xFFFFFFFF) >>> 0;
        }

        function xmlEscape(val) {
            return String(val ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        function colIndexToLetter(idx) {
            let s = '';
            let n = idx + 1;
            while (n > 0) {
                const rem = (n - 1) % 26;
                s = String.fromCharCode(65 + rem) + s;
                n = Math.floor((n - 1) / 26);
            }
            return s;
        }

        function buildWorksheetXML(rows) {
            const rowsXml = rows.map((row, rIdx) => {
                const cellsXml = row.map((cell, cIdx) => {
                    const ref = `${colIndexToLetter(cIdx)}${rIdx + 1}`;
                    if (typeof cell === 'number' && !isNaN(cell)) {
                        return `<c r="${ref}"><v>${cell}</v></c>`;
                    }
                    return `<c r="${ref}" t="inlineStr"><is><t>${xmlEscape(cell)}</t></is></c>`;
                }).join('');
                return `<row r="${rIdx + 1}">${cellsXml}</row>`;
            }).join('');

            return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">
  <sheetData>${rowsXml}</sheetData>
</worksheet>`;
        }

        function createZipBlob(filesMap) {
            const encoder = new TextEncoder();
            const localChunks = [];
            const centralChunks = [];
            let offset = 0;

            Object.entries(filesMap).forEach(([fileName, contentStr]) => {
                const nameBytes = encoder.encode(fileName);
                const dataBytes = encoder.encode(contentStr);
                const checksum = crc32(dataBytes);
                const size = dataBytes.length;

                // Local File Header (30 bytes + name)
                const lfh = new Uint8Array(30 + nameBytes.length);
                const lView = new DataView(lfh.buffer);
                lView.setUint32(0, 0x04034b50, true);
                lView.setUint16(4, 20, true);
                lView.setUint16(6, 0, true);
                lView.setUint16(8, 0, true); // STORE (nessuna compressione)
                lView.setUint16(10, 0, true);
                lView.setUint16(12, 0, true);
                lView.setUint32(14, checksum, true);
                lView.setUint32(18, size, true);
                lView.setUint32(22, size, true);
                lView.setUint16(26, nameBytes.length, true);
                lView.setUint16(28, 0, true);
                lfh.set(nameBytes, 30);

                localChunks.push(lfh, dataBytes);

                // Central Directory Header (46 bytes + name)
                const cdh = new Uint8Array(46 + nameBytes.length);
                const cView = new DataView(cdh.buffer);
                cView.setUint32(0, 0x02014b50, true);
                cView.setUint16(4, 20, true);
                cView.setUint16(6, 20, true);
                cView.setUint16(8, 0, true);
                cView.setUint16(10, 0, true);
                cView.setUint16(12, 0, true);
                cView.setUint16(14, 0, true);
                cView.setUint32(16, checksum, true);
                cView.setUint32(20, size, true);
                cView.setUint32(24, size, true);
                cView.setUint16(28, nameBytes.length, true);
                cView.setUint16(30, 0, true);
                cView.setUint16(32, 0, true);
                cView.setUint16(34, 0, true);
                cView.setUint16(36, 0, true);
                cView.setUint32(38, 0, true);
                cView.setUint32(42, offset, true);
                cdh.set(nameBytes, 46);

                centralChunks.push(cdh);
                offset += lfh.length + size;
            });

            const centralSize = centralChunks.reduce((sum, arr) => sum + arr.length, 0);
            const eocd = new Uint8Array(22);
            const eView = new DataView(eocd.buffer);
            const count = Object.keys(filesMap).length;
            eView.setUint32(0, 0x06054b50, true);
            eView.setUint16(4, 0, true);
            eView.setUint16(6, 0, true);
            eView.setUint16(8, count, true);
            eView.setUint16(10, count, true);
            eView.setUint32(12, centralSize, true);
            eView.setUint32(16, offset, true);
            eView.setUint16(20, 0, true);

            return new Blob([...localChunks, ...centralChunks, eocd], {
                type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'
            });
        }

        function exportExcelXLSX() {
            // Foglio 1: Storico Allenamenti
            const sheet1Rows = [
                ['# Allenamento', 'Data', 'Scheda', 'Esercizio', 'Serie', 'Peso (kg)', 'Ripetizioni', 'Volume (kg)']
            ];
            const chronoHistory = [...appState.history].sort((a, b) => {
                const d = new Date(a.date) - new Date(b.date);
                return d !== 0 ? d : (a.workoutNumber || 0) - (b.workoutNumber || 0);
            });

            chronoHistory.forEach((log, lIdx) => {
                const wNum = log.workoutNumber || (lIdx + 1);
                log.exercises.forEach(ex => {
                    ex.sets.forEach((s, sIdx) => {
                        const w = Number(s.weight) || 0;
                        const r = Number(s.reps) || 0;
                        sheet1Rows.push([
                            wNum,
                            log.date.slice(0, 10),
                            log.routineName,
                            ex.name,
                            sIdx + 1,
                            w,
                            r,
                            Number((w * r).toFixed(1))
                        ]);
                    });
                });
            });

            // Foglio 2: Schede e Esercizi
            const sheet2Rows = [
                ['ID Scheda', 'Nome Scheda', 'Visibile in Home', 'Esercizio', 'Serie Target', 'Ripetizioni Target', 'Recupero (sec)']
            ];
            appState.routines.forEach(r => {
                const visStr = r.visibleInHome !== false ? 'SI' : 'NO';
                if (r.exercises.length === 0) {
                    sheet2Rows.push([r.id, r.name, visStr, '', 0, '', 90]);
                } else {
                    r.exercises.forEach(ex => {
                        sheet2Rows.push([
                            r.id,
                            r.name,
                            visStr,
                            ex.name,
                            Number(ex.sets) || 3,
                            String(ex.targetReps || '10'),
                            Number(ex.rest) || 90
                        ]);
                    });
                }
            });

            const files = {
                '[Content_Types].xml': `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">
  <Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>
  <Default Extension="xml" ContentType="application/xml"/>
  <Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>
  <Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>
  <Override PartName="/xl/worksheets/sheet2.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>
</Types>`,
                '_rels/.rels': `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
  <Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>
</Relationships>`,
                'xl/workbook.xml': `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">
  <sheets>
    <sheet name="Storico Allenamenti" sheetId="1" r:id="rId1"/>
    <sheet name="Schede e Esercizi" sheetId="2" r:id="rId2"/>
  </sheets>
</workbook>`,
                'xl/_rels/workbook.xml.rels': `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
  <Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/>
  <Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet2.xml"/>
</Relationships>`,
                'xl/worksheets/sheet1.xml': buildWorksheetXML(sheet1Rows),
                'xl/worksheets/sheet2.xml': buildWorksheetXML(sheet2Rows)
            };

            const blob = createZipBlob(files);
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `GymTrack_Backup_${getTodayISO()}.xlsx`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            showToast('File Excel (.xlsx) scaricato!');
        }

        // Parser ZIP/XLSX nativo per re-importare il file Excel
        async function extractZipEntries(arrayBuffer) {
            const bytes = new Uint8Array(arrayBuffer);
            const view = new DataView(arrayBuffer);
            const decoder = new TextDecoder('utf-8');
            const entries = {};
            let pos = 0;

            while (pos + 30 < bytes.length) {
                const sig = view.getUint32(pos, true);
                if (sig !== 0x04034b50) break;

                const compression = view.getUint16(pos + 8, true);
                const compSize = view.getUint32(pos + 18, true);
                const nameLen = view.getUint16(pos + 26, true);
                const extraLen = view.getUint16(pos + 28, true);

                const fileName = decoder.decode(bytes.slice(pos + 30, pos + 30 + nameLen));
                const dataStart = pos + 30 + nameLen + extraLen;
                const dataSlice = bytes.slice(dataStart, dataStart + compSize);

                if (compression === 0) {
                    entries[fileName] = decoder.decode(dataSlice);
                } else if (compression === 8 && typeof DecompressionStream !== 'undefined') {
                    const ds = new DecompressionStream('deflate-raw');
                    const writer = ds.writable.getWriter();
                    writer.write(dataSlice);
                    writer.close();
                    const resp = new Response(ds.readable);
                    entries[fileName] = await resp.text();
                }

                pos = dataStart + compSize;
            }
            return entries;
        }

        function parseSheetRowsFromXML(xmlText, sharedStrings = []) {
            if (!xmlText) return [];
            const doc = new DOMParser().parseFromString(xmlText, 'application/xml');
            const rowNodes = Array.from(doc.getElementsByTagName('row'));
            return rowNodes.map(rNode => {
                const cells = Array.from(rNode.getElementsByTagName('c'));
                const rowArr = [];
                cells.forEach(c => {
                    const ref = c.getAttribute('r') || '';
                    const colLetters = ref.replace(/[0-9]/g, '');
                    let colIdx = 0;
                    for (let i = 0; i < colLetters.length; i++) {
                        colIdx = colIdx * 26 + (colLetters.charCodeAt(i) - 64);
                    }
                    colIdx = Math.max(0, colIdx - 1);

                    const type = c.getAttribute('t');
                    let val = '';
                    if (type === 'inlineStr') {
                        const tNode = c.getElementsByTagName('t')[0];
                        val = tNode ? tNode.textContent : '';
                    } else if (type === 's') {
                        const vNode = c.getElementsByTagName('v')[0];
                        const idx = vNode ? parseInt(vNode.textContent) : -1;
                        val = sharedStrings[idx] ?? '';
                    } else {
                        const vNode = c.getElementsByTagName('v')[0];
                        val = vNode ? vNode.textContent : '';
                    }
                    rowArr[colIdx] = val;
                });
                return rowArr;
            });
        }

        async function importExcelXLSX(event) {
            const file = event.target.files?.[0];
            if (!file) return;

            try {
                const buf = await file.arrayBuffer();
                const entries = await extractZipEntries(buf);

                let sharedStrings = [];
                if (entries['xl/sharedStrings.xml']) {
                    const ssDoc = new DOMParser().parseFromString(entries['xl/sharedStrings.xml'], 'application/xml');
                    sharedStrings = Array.from(ssDoc.getElementsByTagName('si')).map(si =>
                        Array.from(si.getElementsByTagName('t')).map(t => t.textContent).join('')
                    );
                }

                const s1Rows = parseSheetRowsFromXML(entries['xl/worksheets/sheet1.xml'], sharedStrings);
                const s2Rows = parseSheetRowsFromXML(entries['xl/worksheets/sheet2.xml'], sharedStrings);

                if (s1Rows.length <= 1 && s2Rows.length <= 1) {
                    showToast('Il file Excel selezionato è vuoto o non riconosciuto', true);
                    return;
                }

                // Ricostruzione Schede dal Foglio 2
                if (s2Rows.length > 1) {
                    const routinesMap = new Map();
                    for (let i = 1; i < s2Rows.length; i++) {
                        const [rId, rName, visStr, exName, setsVal, repsVal, restVal] = s2Rows[i];
                        if (!rName) continue;
                        const key = rId || rName;
                        if (!routinesMap.has(key)) {
                            routinesMap.set(key, {
                                id: rId || ('routine-' + routinesMap.size + '-' + Date.now()),
                                name: String(rName),
                                visibleInHome: String(visStr || 'SI').toUpperCase() !== 'NO',
                                exercises: []
                            });
                        }
                        if (exName) {
                            routinesMap.get(key).exercises.push({
                                id: 'ex-' + i + '-' + Date.now(),
                                name: String(exName),
                                sets: Math.max(1, parseInt(setsVal) || 3),
                                targetReps: String(repsVal || '10'),
                                rest: Math.max(5, parseInt(restVal) || 90),
                                lastWeights: [],
                                lastReps: []
                            });
                        }
                    }
                    if (routinesMap.size > 0) {
                        appState.routines = Array.from(routinesMap.values());
                    }
                }

                // Ricostruzione Storico dal Foglio 1
                if (s1Rows.length > 1) {
                    const sessionsMap = new Map();
                    for (let i = 1; i < s1Rows.length; i++) {
                        const [wNum, dateStr, rName, exName, setNum, weightVal, repsVal] = s1Rows[i];
                        if (!exName) continue;
                        const num = parseInt(wNum) || 1;
                        const cleanDate = String(dateStr || getTodayISO()).slice(0, 10);
                        const sKey = `${num}__${cleanDate}__${rName || 'Allenamento'}`;

                        if (!sessionsMap.has(sKey)) {
                            sessionsMap.set(sKey, {
                                id: 'imp-' + num + '-' + Date.now() + '-' + i,
                                workoutNumber: num,
                                date: cleanDate,
                                routineId: '',
                                routineName: String(rName || 'Allenamento'),
                                exercises: []
                            });
                        }
                        const sess = sessionsMap.get(sKey);
                        let exEntry = sess.exercises.find(e => e.name === String(exName));
                        if (!exEntry) {
                            exEntry = { exerciseId: '', name: String(exName), sets: [] };
                            sess.exercises.push(exEntry);
                        }
                        exEntry.sets.push({
                            weight: parseFloat(weightVal) || 0,
                            reps: parseInt(repsVal) || 0
                        });
                    }
                    if (sessionsMap.size > 0) {
                        appState.history = Array.from(sessionsMap.values()).sort((a, b) => {
                            const d = new Date(b.date) - new Date(a.date);
                            return d !== 0 ? d : (b.workoutNumber || 0) - (a.workoutNumber || 0);
                        });
                    }
                }

                sessionDrafts = {};
                persistAppState();
                showToast('Backup Excel (.xlsx) importato con successo!');
                renderCurrentView();
            } catch (err) {
                console.error(err);
                showToast('Errore durante la lettura del file Excel', true);
            } finally {
                event.target.value = '';
            }
        }

        function exportJSON() {
            const blob = new Blob([JSON.stringify(appState, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `GymTrack_Backup_${getTodayISO()}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            showToast('Backup JSON scaricato!');
        }

        function importJSON(event) {
            const file = event.target.files?.[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const parsed = JSON.parse(e.target.result);
                    appState = normalizeData(parsed);
                    sessionDrafts = {};
                    persistAppState();
                    showToast('Backup JSON ripristinato!');
                    renderCurrentView();
                } catch (err) {
                    showToast('File JSON non valido', true);
                }
            };
            reader.readAsText(file);
            event.target.value = '';
        }

        // ============================================================
        // 7. UTILITY UI
        // ============================================================
        let toastTimer = null;
        function showToast(msg, isError = false) {
            const t = document.getElementById('toast');
            const m = document.getElementById('toast-message');
            const ic = document.getElementById('toast-icon');
            m.textContent = msg;
            ic.textContent = isError ? '!' : '✓';
            ic.className = isError ? 'text-red-400 font-black' : 'text-brand-400 font-black';
            t.classList.remove('opacity-0', '-translate-y-2');
            t.classList.add('opacity-100', 'translate-y-0');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => {
                t.classList.add('opacity-0', '-translate-y-2');
                t.classList.remove('opacity-100', 'translate-y-0');
            }, 2600);
        }

        function formatDateIT(isoStr) {
            if (!isoStr) return '';
            const parts = isoStr.slice(0, 10).split('-');
            if (parts.length !== 3) return isoStr;
            return `${parts[2]}/${parts[1]}/${parts[0]}`;
        }

        function escapeHtml(str) {
            if (typeof str !== 'string') return String(str ?? '');
            return str.replace(/[&<>"']/g, m => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            })[m]);
        }

        window.onload = function() {
            updateTimerBarUI();
            renderCurrentView();
        };
    </script>
